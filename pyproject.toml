[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mama-integrations"
version = "0.1.0"
description = "Version-pinned import/export adapters connecting MAMA (Measuring Automation & Measuring Autonomy) use cases to the upstream `mama` (measuring and managing autonomy) method's assessments and ledgers. Consumes versioned outputs; never reimplements scoring."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "MAMA maintainers" }]
keywords = ["automation", "autonomy", "governance", "measurement", "mama"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Office/Business",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = ["pyyaml>=6.0"]

[project.urls]
Homepage = "https://github.com/Measuring-Automation-Managing-Autonomy/mama-integrations"
Issues = "https://github.com/Measuring-Automation-Managing-Autonomy/mama-integrations/issues"
Upstream-method = "https://github.com/emmanuel-a-otchere/MeasuringAndManagingAutonomy"

[project.optional-dependencies]
dev = ["pytest>=8", "jsonschema>=4.21"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
